<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Audio Classifier - Teachable Machine</title>
<link rel="stylesheet" href="evcss.css">
</head>
<body>
  
  <div class='container'>
    <h1>EV SOUND DETECTOR</h1>
    <p id="status">Loading model...</p>
    <button id="start-btn" disabled>Start</button>
    <div id="label-container"></div>
  </div>
  

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>

  <script>
    const URL = "https://teachablemachine.withgoogle.com/models/khZSqE-tz/";

    const THRESHOLD_PERCENT = 90;

    const HIDDEN_LABELS = ["Background Noise", "_background_noise_", "Unknown"];

    let recognizer, labelContainer, isListening = false;

    async function createModel() {
      const checkpointURL = URL + "model.json";l
      const metadataURL = URL + "metadata.json";

      const recognizer = speechCommands.create(
        "BROWSER_FFT",
        undefined,
        checkpointURL,
        metadataURL
      );

      await recognizer.ensureModelLoaded();
      return recognizer;
    }

    async function init() {
      try {
        recognizer = await createModel();
        const classLabels = recognizer.wordLabels();

        labelContainer = document.getElementById("label-container");
        labelContainer.innerHTML = "";
        for (let i = 0; i < classLabels.length; i++) {
          labelContainer.appendChild(document.createElement("div"));
        }

        document.getElementById("status").innerText = "Model ready!";
        document.getElementById("start-btn").disabled = false;
      } catch (err) {
        document.getElementById("status").innerText = "Failed to load model: " + err.message;
        console.error(err);
      }
    }

    function stopListening() {
      if (!isListening || !recognizer) return;
      isListening = false;
      recognizer.stopListening();
      document.getElementById("start-btn").innerText = "Listen Again";
      document.getElementById("start-btn").disabled = false;
    }

    function startListening() {
      if (isListening || !recognizer) return;
      isListening = true;
      document.getElementById("start-btn").innerText = "Listening...";
      document.getElementById("start-btn").disabled = true;

      const classLabels = recognizer.wordLabels();

      recognizer.listen(
        result => {
          const scores = result.scores;

          console.log(classLabels.map((l, i) => l + ": " + (scores[i]*100).toFixed(1) + "%").join(" | "));

          let detectedLabel = null;
          let detectedScore = 0;

          for (let i = 0; i < classLabels.length; i++) {
            const label = classLabels[i];
            const scorePercent = scores[i] * 100;
            const el = labelContainer.childNodes[i];

            const isNoise = HIDDEN_LABELS.some(
              h => h.toLowerCase() === label.toLowerCase()
            );

            if (!isNoise && scorePercent >= THRESHOLD_PERCENT) {
              el.innerText = label + ": " + scorePercent.toFixed(1) + "%";
              el.style.display = "block";
              detectedLabel = label;
              detectedScore = scorePercent;
            } else {
              el.style.display = "none";
            }
          }

          if (detectedLabel) {
            document.getElementById("status").innerText =
              "Detected: " + detectedLabel + " (" + detectedScore.toFixed(1) + "%) — Stop Listening";
            stopListening();
          } else {
            document.getElementById("status").innerText = "Listening...";
          }
        },
        {
          includeSpectrogram: false,
          probabilityThreshold: 0,
          invokeCallbackOnNoiseAndUnknown: true,
          overlapFactor: 0.5
        }
      );
    }

    document.getElementById("start-btn").addEventListener("click", startListening);

    init();
  </script>

</body>
</html>
